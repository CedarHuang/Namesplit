[package]
name = "namesplit"
version = "0.0.0"
description = "Namesplit — Windows DNS 分流客户端"
authors = ["CedarHuang"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "namesplit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
