[package]
name = "namesplit"
version = "0.0.0"
description = "Namesplit — Windows DNS 分流客户端"
authors = ["CedarHuang"]
edition = "2021"
rust-version = "1.90"
default-run = "namesplit"

[lib]
name = "namesplit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 启动随机 token：系统 CSPRNG。
getrandom = "0.3"
# Windows Job Object：保证 Tauri 被强杀时 sidecar 一起结束。
# IP Helper 用于端口占用归因与网卡 DNS 读取，WinSock/Ndis 提供地址族与接口类型，
# WindowsAndMessaging 提供退出提醒的原生消息框。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-window-state = "2"
webview2-com = "0.39"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
